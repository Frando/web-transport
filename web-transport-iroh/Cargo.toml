[package]
name = "web-transport-iroh"
description = "WebTransport library for Iroh"
authors = ["Luke Curley"]
repository = "https://github.com/kixelated/web-transport"
license = "MIT OR Apache-2.0"

version = "0.8.1"
edition = "2021"

keywords = ["quic", "http3", "webtransport", "iroh"]
categories = ["network-programming", "web-programming"]

[dependencies]
bytes = "1"
futures = "0.3"
http = "1"
iroh = "0.91.2"
log = "0.4"
quinn = { package = "iroh-quinn", version = "0.14" }
quinn-proto = { package = "iroh-quinn-proto", version = "0.13" }
thiserror = "2"
tokio = { version = "1", default-features = false, features = [
    "io-util",
    "macros",
] }
url = "2"
web-transport-proto = { path = "../web-transport-proto", version = "0.2" }
web-transport-trait = { path = "../web-transport-trait", version = "0.1" }

[dev-dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
rustls-pemfile = "2"
tokio = { version = "1", features = ["full"] }
